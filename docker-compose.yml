services:
  backend:
    image: ghcr.io/nergisulu13/sla-meter-backend:v1
    container_name: sla-backend
    ports:
      - "5000:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/nergisulu13/sla-meter-frontend:v1
    container_name: sla-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
