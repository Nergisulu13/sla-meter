services:
  auth:
    image: ghcr.io/nergisulu13/sla-meter-auth:v2
    container_name: sla-auth
    ports:
      - "5183:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  backend:
    image: ghcr.io/nergisulu13/sla-meter-backend:v2
    container_name: sla-backend
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - ./data:/app/data
    depends_on:
      - auth
    restart: unless-stopped

  frontend:
    image: ghcr.io/nergisulu13/sla-meter-frontend:v2
    container_name: sla-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
      - auth
    restart: unless-stopped