services:
  backend:
    build:
      context: ./SlaMonitor.Api
      dockerfile: Dockerfile
    container_name: sla-backend
    ports:
      - "5000:8080"
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./sla-monitor-ui
      dockerfile: Dockerfile
    container_name: sla-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend